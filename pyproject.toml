[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tango-milonga"
version = "0.1.0"
description = "Qt administration console for Tango Controls"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.6",
    "shiboken6>=6.6",
    "pyqtgraph>=0.13",
    "qasync>=0.27",
    "pytango>=9.4"
]

[project.urls]
Homepage = "https://github.com/ckoern/tango-milonga/tree/main"
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.2",
    "mypy>=1.8",
    "ruff>=0.5",
    "vermin>=1.6",
]

[project.scripts]
milonga = "milonga.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["milonga"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["qasync.*", "pyqtgraph.*", "tango.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Tango attribute values and command arguments are dynamic
    "RUF001",  # typographic characters are intentional in UI strings
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"milonga/ui/**" = ["B008"]  # Qt virtual methods take QModelIndex() defaults
"tests/**" = ["ANN"]
